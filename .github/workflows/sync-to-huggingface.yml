name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare the Space contents
        run: |
          mkdir -p /tmp/hf-space
          rsync -a --delete ./ /tmp/hf-space/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'Qiskit-Intuition/' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/.vite/' \
            --exclude 'frontend/dist/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.streamlit/secrets.toml' \
            --exclude '.swarm/' \
            --exclude '.claude-flow/' \
            --exclude '*.log' \
            --exclude 'ruvector.db' \
            --exclude '.DS_Store'

      # The Hub rejects binary files (fonts, images) pushed over plain git, so
      # upload through the Hub client, which stores them with Xet. --delete "*"
      # removes files that no longer exist here, mirroring the repository; the
      # Space's .gitattributes is never deleted.
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is missing."
            exit 1
          fi
          pip install --quiet "huggingface_hub[hf_xet]"
          hf upload j76dvyt4q5-cyber/Qiskit-Intuition /tmp/hf-space . \
            --repo-type space \
            --delete "*" \
            --commit-message "Sync from GitHub ${GITHUB_SHA}"
