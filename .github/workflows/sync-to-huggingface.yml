name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is missing."
            exit 1
          fi

          mkdir -p /tmp/hf-space
          rsync -av --delete ./ /tmp/hf-space/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'Qiskit-Intuition/' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/.vite/' \
            --exclude 'frontend/dist/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.streamlit/' \
            --exclude '.swarm/' \
            --exclude '.claude-flow/' \
            --exclude '*.log' \
            --exclude 'ruvector.db' \
            --exclude '.DS_Store'

          cd /tmp/hf-space
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sync from GitHub ${GITHUB_SHA}"
          git remote add huggingface "https://j76dvyt4q5-cyber:${HF_TOKEN}@huggingface.co/spaces/j76dvyt4q5-cyber/Qiskit-Intuition"
          git push --force huggingface main
